<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search EQLWiki</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; min-width: 420px; height: auto; overflow: auto; }
    .quick-wrap { padding: 16px; }
    .quick-wrap p { margin: 0 0 10px; color: #98adbf; font-size: 12px; }
  </style>
</head>
<body>
  <main class="quick-wrap">
    <div class="title-row">
      <img src="icons/icon48.png" alt="" width="34" height="34">
      <div>
        <h1>EQLWiki Quick Search</h1>
        <p>Search EQLWiki from Chrome's context menu</p>
      </div>
    </div>

    <form id="quick-search-form" class="search-block">
      <label for="quick-search">Search EQLWiki</label>
      <div class="search-row">
        <div class="popup-search-input-wrap"><input id="quick-search" type="search" placeholder="Item, NPC, spell..." autocomplete="off" required><div id="quick-suggestions" class="popup-suggestions" hidden></div></div>
        <button type="submit">Search</button>
      </div>
    </form>
  </main>
  <script src="quicksearch.js"></script>
</body>
</html>
